name: Documentation

on:
  push:
    branches:
      - main
  # Every base branch, so stacked pull requests are tested before they are retargeted to main.
  pull_request:

permissions:
  contents: read

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Render the documentation without warnings
        run: |
          mkdir -p Documentation-GENERATED-temp \
          && docker run --rm --pull always -v "$(pwd)":/project \
            ghcr.io/typo3-documentation/render-guides:latest --config=Documentation --no-progress --fail-on-log
