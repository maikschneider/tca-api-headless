name: Static Code Analysis

on:
  push:
    branches:
      - main
  # Every base branch, so stacked pull requests are tested before they are retargeted to main.
  pull_request:

permissions:
  contents: read

jobs:
  sca:
    name: SCA (TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ["13.4", "14.3"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Install Composer dependencies
        run: |
          ddev start
          ddev composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          ddev composer update --no-progress --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      - name: Log versions
        run: ddev composer show typo3/cms-core

      - name: Run static code analysis
        run: ddev composer ci:sca

      - uses: staabm/annotate-pull-request-from-checkstyle-action@v1
        name: Annotate PHP CS Fixer
        if: always()
        with:
          files: php-cs-fixer.xml
          notices-as-warnings: true

      - uses: staabm/annotate-pull-request-from-checkstyle-action@v1
        name: Annotate PHPStan
        if: always()
        with:
          files: phpstan.xml
          notices-as-warnings: true
