name: Tests

on:
  push:
    branches:
      - main
  # Every base branch, so stacked pull requests are tested before they are retargeted to main.
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ["13.4", "14.3"]
        php-version: ["8.2", "8.3", "8.4"]
        include:
          - php-version: "8.2"
            phpunit-version: "^11.5"
          - php-version: "8.3"
            phpunit-version: "^12.5"
          - php-version: "8.4"
            phpunit-version: "^12.5"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install Composer dependencies
        run: composer update --no-progress --with=typo3/cms-core:"^${{ matrix.typo3-version }}" --with=phpunit/phpunit:"${{ matrix.phpunit-version }}"

      - name: Log versions
        run: |
          php --version
          composer show typo3/cms-core
          composer show phpunit/phpunit
          composer show maikschneider/tca-api

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  functional-tests:
    name: Functional (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ["13.4", "14.3"]
        php-version: ["8.2", "8.3", "8.4"]
        include:
          - php-version: "8.2"
            phpunit-version: "^11.5"
          - php-version: "8.3"
            phpunit-version: "^12.5"
          - php-version: "8.4"
            phpunit-version: "^12.5"

    steps:
      - uses: actions/checkout@v4

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=${{ matrix.php-version }}
          ddev start

      - name: Install Composer dependencies
        run: |
          ddev composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          ddev composer update --no-progress --with=typo3/cms-core:"^${{ matrix.typo3-version }}" --with=phpunit/phpunit:"${{ matrix.phpunit-version }}"

      - name: Log versions
        run: |
          ddev exec php --version
          ddev composer show typo3/cms-core
          ddev composer show phpunit/phpunit
          ddev composer show maikschneider/tca-api

      - name: Init TYPO3
        run: ddev init-typo3

      - name: Run functional tests
        run: ddev exec vendor/bin/phpunit --testsuite Functional

  # Real requests against the DDEV site, validated against the CLI's OpenAPI document.
  http-tests:
    name: HTTP (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - typo3-version: "13.4"
            php-version: "8.2"
          - typo3-version: "14.3"
            php-version: "8.4"

    steps:
      - uses: actions/checkout@v4

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=${{ matrix.php-version }}
          ddev start

      - name: Install Composer dependencies
        run: |
          ddev composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          ddev composer update --no-progress --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      - name: Log versions
        run: |
          ddev exec php --version
          ddev composer show typo3/cms-core
          ddev composer show maikschneider/tca-api

      # DDEV writes its database and trusted hosts configuration only on a start
      # that finds the settings.php created by the init, hence the restart.
      - name: Init TYPO3
        run: |
          ddev init-typo3
          ddev restart

      - name: Write the OpenAPI document with the CLI
        run: |
          mkdir -p var/http
          ddev exec vendor/bin/typo3 tca-api:openapi main --output var/http/openapi.json

      - uses: oven-sh/setup-bun@v2

      - name: Install test dependencies
        working-directory: Tests/Http
        run: bun install --frozen-lockfile

      - name: Run HTTP tests
        working-directory: Tests/Http
        run: |
          # The sites of init-typo3 use DDEV's primary URL, served with a mkcert certificate.
          export TYPO3_BASE_URL="$(ddev exec printenv DDEV_PRIMARY_URL)"
          export NODE_EXTRA_CA_CERTS="$(mkcert -CAROOT)/rootCA.pem"
          echo "Base URL: ${TYPO3_BASE_URL}, CA: ${NODE_EXTRA_CA_CERTS}"
          FE_SESSION="$(ddev fe-session member | cut -d= -f2-)"
          export FE_SESSION
          bun test

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install demo dependencies
        working-directory: demo
        run: bun install --frozen-lockfile

      - name: Compare the demo's types with the OpenAPI document
        working-directory: demo
        run: bun run types:compare

      - name: Check and build the demo
        working-directory: demo
        run: |
          bun run check
          bun run build

      - name: Render the demo
        working-directory: demo
        run: |
          export TYPO3_BASE_URL="$(ddev exec printenv DDEV_PRIMARY_URL)"
          export NODE_EXTRA_CA_CERTS="$(mkcert -CAROOT)/rootCA.pem"
          FE_SESSION="$(ddev fe-session member | cut -d= -f2-)"
          export FE_SESSION
          bun test
